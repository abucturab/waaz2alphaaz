[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waaz2alphaaz"
version = "0.1.0"
description = "Transcribe voice clips and output documents in custom language (Alphaaz)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "waaz2alphaaz" }]
keywords = ["transcription", "speech-to-text", "custom-language", "alphaaz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
waaz2alphaaz = "waaz2alphaaz.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["waaz2alphaaz*"]
