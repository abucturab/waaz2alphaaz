[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "waaz2alphaaz"
version = "0.1.0"
description = "ASR transcription tool for Lisan-ud-Dawat — converts audio (duas, madeh, speech) to Arabic-script text"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
waaz2alphaaz = "waaz2alphaaz.transcribe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
